      #   §8.4：contracts 变更需触发消费者契约重跑 + 兼容性声明。
      # TODO: IT-2.05 —— 评测集回归：eval/golden-set-v1（≥200 条标注）Recall@5 ≥ 0.9 /
      #   政策命中 ≥ 0.95 / 幻觉率门禁（DD-13 RAG 离线评测层，§8.3 卡口"评测集回归自 IT-2.05 起接入"）。
      # TODO: IT-2.x —— 业务单测/契约测试并入本 Gate 4（目录约定 tests/ + discover，夹具来自 IT-1.07）。
