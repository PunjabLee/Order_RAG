openapi: 3.0.3
info:
  title: "TradeWise API v1 - 到货通知（Notifications）"
  version: "1.0.0"
  description: |
    权威来源：《设计文档.md》DD-7.1 总览表（到货通知登记行：POST /api/v1/notifications/arrival，Bearer，
    sku+user 去重，非流式，错误码前缀"—"，US-003-S4）、DD-7.7（订阅后由通知服务触达）、
    DD-2 US-003 异常处理（库存不足 → 替代推荐或登记到货通知，通知服务承担，整改 M-3；接口 DD-7.7.5）、
    US-003-S4（options[] 含替代 SKU 或 action=subscribe_arrival → chat-v1 OptionsEvent.action 衔接）。

    红线自查：错误响应含 error_code/trace_id（R-5）；金额不涉及（sku 指向不构成交易参数——
    本接口为订阅登记，无交易语义，ADR-001 不违反）。
    幂等（DD-7.1）：sku + user 去重——同一用户对同一 SKU 重复登记返回首次订阅结果。
    兼容性：只增不改不删（DD-7.1）。示例值治理：全部示例为示例值，以实际服务返回为准（〇.1）。
  x-contract-status: "IT-1.09 冻结预备（frozen-candidate）"
  x-dd-mapping: "DD-7.1（到货通知行）/ DD-7.7 / US-003-S4 / M-3"
  license:
    name: "Internal - TradeWise (契约文档随仓库维护，未对外授权)"

servers:
  - url: https://api.tradewise.example
    description: "网关基址（示例值，以实际部署为准）"

security:
  - bearerAuth: []

paths:
  /api/v1/notifications/arrival:
    post:
      operationId: subscribeArrival
      summary: "到货通知登记（US-003-S4，通知服务触达）"
      description: |
        触发入口：对话链 options 帧 action=subscribe_arrival（chat-v1 OptionsEvent）或用户显式要求。
        幂等：sku+user 去重（DD-7.1）——重复登记返回既有 subscription_id（status=already_subscribed），
        不产生重复订阅。触达由通知服务承担（PRD-1.3 NOTIFY 节点），本接口只负责登记。
      parameters:
        - $ref: "shared-schemas.yaml#/components/parameters/AuthorizationHeader"
        - $ref: "shared-schemas.yaml#/components/parameters/XRequestIdHeader"
        - $ref: "shared-schemas.yaml#/components/parameters/XTenantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArrivalSubscribeRequest"
            example:
              sku: "SKU_A"                          # 示例值，以实际服务返回为准
              session_id: "opaque_uuid_01HXAMPLE"   # 示例值，以实际服务返回为准
      responses:
        "200":
          description: "登记成功或命中既有订阅（幂等语义）。"
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: "shared-schemas.yaml#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ArrivalSubscription"
        "401":
          $ref: "shared-schemas.yaml#/components/responses/Err401"
        "404":
          description: "SKU 不存在（RAG-40401；状态码映射口径见 errors-dict.yaml C-①）。"
          content:
            application/json:
              schema:
                $ref: "shared-schemas.yaml#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "shared-schemas.yaml#/components/responses/Err422"
        "429":
          $ref: "shared-schemas.yaml#/components/responses/Err429"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "与 shared-schemas.yaml components.securitySchemes 同构（本文件本地冗余声明，满足 OpenAPI 3.0 security 引用闭环）。"

  schemas:
    ArrivalSubscribeRequest:
      description: "到货通知登记请求：目标 SKU + 可选会话锚点。不接受数量/价格等交易要素（本接口无交易语义）。"
      type: object
      required: [sku]
      additionalProperties: false
      properties:
        sku:
          type: string
          description: "订阅的目标 SKU（存在性校验，DD-3.3.1 sku 同源规则；服务端权威，客户端仅指针）。示例值，以实际服务返回为准。"
          example: "SKU_A"
        session_id:
          type: string
          nullable: true
          description: "来源会话（可选，供触达文案上下文与溯源 trace，DD-11.5）。"
    ArrivalSubscription:
      type: object
      required: [subscription_id, sku, status]
      properties:
        subscription_id:
          type: string
          description: "订阅 ID（sku+user 去重命中时返回既有值）。示例值，以实际服务返回为准。"
          example: "sub_01HXAMPLE"
        sku:
          type: string
          example: "SKU_A"                          # 示例值，以实际服务返回为准
        status:
          type: string
          description: "subscribed=新登记；already_subscribed=命中既有订阅（幂等重放）。"
          enum: [subscribed, already_subscribed]
        restock_eta_note:
          type: string
          nullable: true
          description: "补货时间说明（DD-6.1#4 补货时间口径；文案以商品/物流服务实际返回为准，示例值）。"
